[project]
name = "hybgensea"
dynamic = ["version"]
authors = [{name = "Changhyun Kwon"}, {name = "Mauricio Souza de Alencar", email="mdealencar@gmx.com" }]
maintainers = [{name = "Mauricio Souza de Alencar", email="mdealencar@gmx.com"}]
description = "Wrapper for the Hybrid Genetic Search algorithm for Capacitated Vehicle Routing Problems (HGS-CVRP)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python=">=3.10"
dependencies = ["numpy"]
license = "MIT"
license-files = ["LICENSE", "HGS-CVRP/LICENSE"]

[project.urls]
"Issue Tracker" = "https://github.com/mdealencar/HybGenSea/issues"
"Source" = "https://github.com/mdealencar/HybGenSea"

[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.2", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
sdist.exclude = ["HGS-CVRP/.github", "HGS-CVRP/Instances", "HGS-CVRP/Test"]
# Generated by setuptools-scm and gitignored, so it must be listed explicitly
sdist.include = ["hybgensea/_version.py"]

# The version comes from the git tag
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_file = "hybgensea/_version.py"
