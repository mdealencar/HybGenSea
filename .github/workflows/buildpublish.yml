name: Build wheels+sdist and publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # Builds the sdist, then a wheel from it: proves the sdist is complete
      - name: Build SDist
        run: pipx run build
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
  build_wheels:
    name: Wheels on ${{ matrix.os }}, ${{ (matrix.manylinux || matrix.musllinux) && format('-{0}', matrix.manylinux || matrix.musllinux) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds: one job per manylinux baseline
          - os: ubuntu-latest
            manylinux: manylinux2014
            manylinux_x86_64_image: manylinux2014
            cibw_build: "*manylinux*"
          - os: ubuntu-latest
            manylinux: manylinux_2_28
            manylinux_x86_64_image: manylinux_2_28
            cibw_build: "*manylinux*"
          - os: ubuntu-latest
            manylinux: manylinux_2_34
            manylinux_x86_64_image: manylinux_2_34
            cibw_build: "*manylinux*"
          # Musllinux builds
          - os: ubuntu-latest
            musllinux: musllinux_1_2
            cibw_build: "*musllinux*"
          # Windows & macOS builds
          - os: windows-latest
          - os: macos-15   # Apple Silicon
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: pypa/cibuildwheel@v4.2
        env:
          CIBW_BUILD: ${{ matrix.cibw_build || '*' }}
          CIBW_ARCHS: auto64
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux_x86_64_image || '' }}
          CIBW_MUSLLINUX_X86_64_IMAGE: ${{ matrix.musllinux || '' }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}${{ (matrix.manylinux || matrix.musllinux) && format('-{0}', matrix.manylinux || matrix.musllinux) || '' }}
          path: wheelhouse/*.whl
  publish_all:
    name: Publish on PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
