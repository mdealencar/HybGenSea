# Quick checks of every change: lint, then build the sdist and test the package
# installed from it on each OS. Publishes nothing.
name: Test

on:
  push:
    branches: [ HybGenSea ]
  pull_request:
    branches: [ HybGenSea ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Fail on Python syntax errors or undefined names
      - run: pipx run ruff check --select E9,F63,F7,F82 .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-15 ]
        python-version: [ "3.10", "3.14" ]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Install from the sdist rather than the checkout: proves the sdist is complete
      - name: Build sdist
        run: pipx run build --sdist
      - name: Install from sdist
        run: python -m pip install pytest dist/*.tar.gz
      # Run outside the checkout so that the installed package is imported
      - name: Run tests
        working-directory: ${{ runner.temp }}
        run: python -m pytest -v --pyargs hybgensea.tests
